# Render Blueprint for NovaTutor.
#
# Frontend: free static site (React + Vite, SPA rewrite)
# Backend:  free Docker web service (Java 21 + Spring Boot 3.5.3, prod profile)
# Database: external managed MySQL-compatible service (see DEPLOYMENT.md)
#
# Values marked `sync: false` are secrets/instance-specific and must be set in
# the Render dashboard. They are never stored in this file.

services:
  - type: web
    name: novatutor-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./deploy/backend.Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Managed MySQL-compatible database (TLS required by the provider).
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Set to `update` only for the very first deploy against an empty schema,
      # then change back to `validate`.
      - key: JPA_DDL_AUTO
        value: validate
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Measured: 3.6-flash needs 7-10 s per short answer; 3.5-flash-lite ~1.3 s.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Exact public frontend origin, no trailing slash.
      - key: CORS_ORIGINS
        sync: false
      # First deploy on an empty database: true (seeds courses, lessons, quizzes).
      # Afterwards set false so startup stays fast.
      - key: APP_SEED_ENABLED
        value: "false"
      # Free web services cannot run Docker-in-Docker, so the judge delegates to
      # an isolated remote runner (Judge0-compatible) instead of local containers.
      # `remote` never executes student code inside this service.
      - key: CODE_RUNNER_ENABLED
        value: "true"
      - key: CODE_RUNNER_PROVIDER
        value: "remote"
      - key: CODE_RUNNER_TIMEOUT_SECONDS
        value: "5"
      - key: RATE_LIMIT_TRUST_PROXY
        value: "true"
      # Public frontend origin used inside verification and reset emails.
      - key: APP_PUBLIC_URL
        value: https://novatutor.onrender.com
      # Transactional email (SMTP relay). Set these in the Render dashboard;
      # registration stays disabled-honest about delivery until they exist.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: MAIL_FROM
        sync: false
      # Google OAuth Web client id (public). The client secret is not used.
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: novatutor
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://novatutor-api.onrender.com https://accounts.google.com https://oauth2.googleapis.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
