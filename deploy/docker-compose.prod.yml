services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_tutor}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_tutor}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://novatutor.onrender.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@novatutor.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NovaTutor}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CODE_RUNNER_ENABLED: ${CODE_RUNNER_ENABLED:-false}
      CODE_RUNNER_PROVIDER: ${CODE_RUNNER_PROVIDER:-remote}
      CODE_RUNNER_REMOTE_URL: ${CODE_RUNNER_REMOTE_URL:-https://ce.judge0.com}
      CODE_RUNNER_REMOTE_KEY: ${CODE_RUNNER_REMOTE_KEY:-}
      CODE_RUNNER_PRODUCTION_ACK: ${CODE_RUNNER_PRODUCTION_ACK:-}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-240}
      RATE_LIMIT_PRE_AUTH_RPM: ${RATE_LIMIT_PRE_AUTH_RPM:-360}
      RATE_LIMIT_AUTH_RPM: ${RATE_LIMIT_AUTH_RPM:-10}
      RATE_LIMIT_AI_RPM: ${RATE_LIMIT_AI_RPM:-25}
      RATE_LIMIT_CODE_RPM: ${RATE_LIMIT_CODE_RPM:-20}
      RATE_LIMIT_UPLOAD_10M: ${RATE_LIMIT_UPLOAD_10M:-5}
      RATE_LIMIT_ADMIN_RPM: ${RATE_LIMIT_ADMIN_RPM:-600}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
      TRUSTED_PROXY_REGEX: ${TRUSTED_PROXY_REGEX:-}
      GUEST_MAX_ACTIVE: ${GUEST_MAX_ACTIVE:-200}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
