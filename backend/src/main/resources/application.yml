spring:
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_tutor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    max-session-ms: ${JWT_MAX_SESSION_MS:604800000}
  gate:
    max-upload-bytes: ${GATE_MAX_UPLOAD_BYTES:5242880}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  public-url: ${APP_PUBLIC_URL:https://novatutor.onrender.com}
  mail:
    # Deliberately under app.* rather than spring.mail.*: Spring Boot's
    # JavaMailSender auto-configuration would register a mail health indicator
    # and mark /actuator/health DOWN whenever SMTP is optional and unset,
    # which would fail the Render readiness check.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    starttls: ${SMTP_STARTTLS:true}
    ssl: ${SMTP_SSL:false}
    from: ${MAIL_FROM:no-reply@novatutor.app}
    from-name: ${MAIL_FROM_NAME:NovaTutor}
  google:
    # Public OAuth 2.0 Web client id. Never put the client secret here; the
    # browser flow uses the ID-token flow, which needs no secret.
    client-id: ${GOOGLE_CLIENT_ID:}
  code-runner:
    enabled: ${CODE_RUNNER_ENABLED:true}
    # auto: use Docker when a daemon exists, otherwise the isolated remote runner.
    provider: ${CODE_RUNNER_PROVIDER:auto}
    remote:
      url: ${CODE_RUNNER_REMOTE_URL:https://ce.judge0.com}
      api-key: ${CODE_RUNNER_REMOTE_KEY:}
      max-code-chars: ${CODE_RUNNER_MAX_CODE_CHARS:100000}
      memory-limit-kb: ${CODE_RUNNER_MEMORY_KB:262144}
    timeout-seconds: ${CODE_RUNNER_TIMEOUT_SECONDS:5}
    memory-mb: ${CODE_RUNNER_MEMORY_MB:256}
    java-image: ${CODE_RUNNER_JAVA_IMAGE:eclipse-temurin:21-jdk}
    python-image: ${CODE_RUNNER_PYTHON_IMAGE:python:3.12-alpine}
    cpp-image: ${CODE_RUNNER_CPP_IMAGE:gcc:14}
    node-image: ${CODE_RUNNER_NODE_IMAGE:node:22-alpine}
    go-image: ${CODE_RUNNER_GO_IMAGE:golang:1.24-alpine}
    production-ack: ${CODE_RUNNER_PRODUCTION_ACK:}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:1000}
    auth-per-minute: ${RATE_LIMIT_AUTH_RPM:30}
    ai-per-minute: ${RATE_LIMIT_AI_RPM:60}
    code-per-minute: ${RATE_LIMIT_CODE_RPM:40}
    upload-per-10-minutes: ${RATE_LIMIT_UPLOAD_10M:15}
    admin-per-minute: ${RATE_LIMIT_ADMIN_RPM:1500}
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}
  upload:
    max-pdf-pages: ${MAX_PDF_PAGES:300}
    max-extracted-characters: ${MAX_PDF_TEXT_CHARS:5000000}
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # Measured on the live API: 3.6-flash needs ~7-10 s even for a trivial
    # answer, while 3.5-flash-lite answers in ~1.3 s. The lightweight model is
    # therefore the default for interactive tutoring and the heavier model is
    # only an opt-in for operators who explicitly accept the latency.
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.1-flash-lite}
    max-attempts: ${GEMINI_MAX_ATTEMPTS:2}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:32768}
