app.gate.notes-dir=${GATE_NOTES_DIR:./gate-notes}
spring.application.name=NovaTutor
# Local secrets live in an untracked file so nothing sensitive is committed.
# Copy .env.properties.example (repo root of backend/) to .env.properties and
# fill in real values. Both common working directories are probed.
spring.config.import=optional:file:${user.dir}/.env.properties,optional:file:${user.dir}/backend/.env.properties
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=8080
